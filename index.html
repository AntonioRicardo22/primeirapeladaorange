<style>
:root{--bg:#f4f1ea;--card:#fff;--tx:#0b1b3a;--mu:#5d6b85;--navy:#0b1b3a;--gold:#c9a227;--bd:#e2dccb;--g:#1f9d55;--r:#c0392b;--b:#2e5eaa;--w:#a50044;--bl:#034694;--ar:#5aa7d8;--br:#2e9c4a;color-scheme:light;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a1226;--card:#121d38;--tx:#f1ecdc;--mu:#9aa8c4;--bd:#25335a;--navy:#060d1f;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{background:var(--navy);color:#f1ecdc;padding:16px;border-bottom:4px solid var(--gold)}
.header-container{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:16px}
header h1{margin:0 0 4px;font-size:17px;color:var(--gold);word-break:break-word}
header p{margin:0;color:#b9c3da;font-size:11px}
.logo-img{height:60px;width:60px;min-width:60px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);box-shadow:0 4px 8px rgba(0,0,0,0.3)}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5;-webkit-overflow-scrolling:touch}
nav::-webkit-scrollbar{height:4px}nav::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
nav button{border:0;background:none;color:var(--mu);padding:8px 12px;border-radius:8px;font:600 13px inherit;cursor:pointer;white-space:nowrap;transition:all .2s}nav button.on{background:var(--navy);color:var(--gold)}
main{max-width:1100px;margin:0 auto;padding:12px}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;overflow:hidden}.k b{display:block;font-size:24px;color:var(--navy)}@media(prefers-color-scheme:dark){.k b{color:var(--gold)}}.k span{color:var(--mu);font-size:11px}
h2{font-size:15px;margin:16px 0 8px}h3{font-size:12px;margin:0 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -12px;padding:0 12px}
@media(min-width:768px){.wrap{margin:0;padding:0}}
table{border-collapse:collapse;width:100%;min-width:480px}th,td{padding:8px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:12px;cursor:pointer;position:sticky;top:0;background:var(--card);user-select:none}th:hover{color:var(--gold)}td.n,th.n{text-align:right}
.bar{height:10px;border-radius:5px;background:var(--bd);overflow:hidden;display:flex}.bar i{display:block;height:100%}
.row{display:grid;grid-template-columns:100px 1fr 35px;gap:6px;align-items:center;margin:6px 0;font-size:12px}
input,select{padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;outline:none;width:100%}input:focus,select:focus{border-color:var(--gold)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.tools > *{flex:1;min-width:140px}
.tag{padding:2px 8px;border-radius:9px;font-size:11px;font-weight:600;color:#fff}.V{background:var(--g)}.D{background:var(--r)}.E{background:#8a8f9c}
.chip{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:2px;vertical-align:middle}.sub{color:var(--mu);font-size:11px}svg{width:100%;height:auto;display:block;max-height:220px}
.hm td{padding:4px 6px;text-align:center;min-width:26px;font-size:12px}
</style></head><body>
